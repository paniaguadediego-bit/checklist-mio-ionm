<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist material MIO/IONM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="barra-sup">
  <span class="marca">MIO<span class="marca-sep">/</span>IONM</span>
  <select id="escenario-select" aria-label="Escenario de cirugía"></select>
  <span class="barra-flex"></span>
  <button type="button" id="btn-quirofano" class="btn-modo" title="Oculta el catálogo y las técnicas para dejar solo el montaje y el resumen">Modo quirófano</button>
</header>

<main>

  <section class="toolbar no-print">
    <button type="button" id="btn-nuevo">Nuevo</button>
    <button type="button" id="btn-duplicar">Duplicar</button>
    <button type="button" id="btn-renombrar">Renombrar</button>
    <button type="button" id="btn-vaciar">Vaciar</button>
    <button type="button" id="btn-borrar" class="peligro">Borrar</button>
    <span class="barra-flex"></span>
    <button type="button" id="btn-exportar">Exportar</button>
    <button type="button" id="btn-imprimir">Imprimir</button>
    <button type="button" id="btn-restablecer" class="peligro">Restablecer</button>
    <span class="guardado-aviso" id="guardado-aviso"></span>
  </section>

  <div class="layout">

    <aside class="panel-catalogo no-print" id="panel-catalogo">
      <div class="panel-cab">
        <h2>Catálogo</h2>
        <button type="button" id="btn-plegar" title="Plegar / desplegar">▾</button>
      </div>
      <input type="search" id="catalogo-buscar" placeholder="Buscar material…" autocomplete="off">
      <p class="panel-ayuda">
        Pulsa un ítem y luego la entrada donde va. También puedes arrastrarlo.
        Para quitarlo: ✕ o arrástralo aquí.
      </p>
      <div id="catalogo-contenido"></div>
    </aside>

    <div class="columna-principal">

      <section class="card tecnicas-card no-print" id="tecnicas">
        <div class="card-cab">
          <h2>Técnicas</h2>
          <label class="perfil-label">
            Perfil
            <select id="perfil-select"></select>
          </label>
        </div>
        <div id="tecnicas-contenido"></div>
      </section>

      <section class="card resumen-card" id="resumen">
        <div class="card-cab">
          <h2>Resumen de material</h2>
        </div>
        <div id="resumen-contenido"></div>
      </section>

      <section id="cajas-contenido"></section>

    </div>

  </div>

</main>

<div class="barra-seleccion no-print" id="barra-seleccion" hidden>
  <span>Colocando <b id="bs-nombre"></b> — pulsa una entrada</span>
  <button type="button" id="bs-cancelar">Cancelar</button>
</div>

<script src="data/surgeries.js"></script>
<script src="app.js"></script>
</body>
</html>
