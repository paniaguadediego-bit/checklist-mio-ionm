<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIO-Check</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d0e">
<!--
  El ?v= de los archivos no es decorativo: GitHub Pages los cachea 10 minutos
  cada uno por su cuenta, así que el navegador puede quedarse con el HTML
  nuevo y el app.js viejo. Cuando eso pasa, la página se dibuja con botones
  que no responden, porque el código que los escucha no ha llegado.
  Cambiar el número hace que la URL sea otra y el navegador la pida de nuevo.

  AL DESPLEGAR UN CAMBIO EN app.js, style.css O data/: sube este número.
-->
<link rel="stylesheet" href="style.css?v=20260907">
</head>
<body>

<header class="barra-sup">
  <div class="barra-fila">
    <img class="marca" src="img/favicon.png" alt="MIO-Check" width="32" height="32">
    <select id="perfil-usuario" data-i18n-aria="perfil_usuario_aria" data-i18n-title="perfil_usuario_aria"></select>
    <button type="button" id="btn-catalogos" class="btn-modo" data-i18n="btn_catalogos" data-i18n-title="btn_catalogos_tit"></button>
    <span class="barra-flex"></span>
    <!-- Guía de uso / Idioma / Docente son de consulta ocasional, no de cada
         gesto: van agrupados en un desplegable para no competir en ancho con
         Montajes/Gestión de casos/Sincronizar, que sí se tocan a diario. -->
    <div class="menu-desplegable">
      <button type="button" id="btn-menu" class="btn-modo" data-i18n-title="btn_menu_tit">⋮</button>
      <div class="menu-lista" id="menu-lista" hidden>
        <button type="button" id="btn-idioma" title="Switch to English">EN</button>
        <button type="button" id="btn-guia" data-i18n-title="btn_guia_tit" data-i18n="btn_guia"></button>
        <button type="button" id="btn-docente" data-i18n="btn_docente"></button>
      </div>
    </div>
  </div>
  <div class="barra-fila barra-fila-casos">
    <button type="button" id="btn-casos" class="btn-modo" data-i18n-title="btn_casos_tit" data-i18n="btn_casos"></button>
    <button type="button" id="btn-sync" class="btn-modo" data-i18n-title="sync_titulo">☁ <span id="sync-estado"></span></button>
    <span class="barra-flex"></span>
    <span class="guardado-aviso" id="guardado-aviso"></span>
  </div>
</header>

<!-- Rótulo permanente (Fase 4.2): dice siempre qué se está tocando, una
     plantilla suelta o el material de un caso concreto. Va aquí, fuera de
     <main>, para que su position:sticky se enganche justo debajo de la
     cabecera desde el principio -no como banner ocasional, sino como
     orientación constante-. -->
<div class="barra-caso no-print" id="barra-caso">
  <span class="barra-caso-info">
    <span id="barra-caso-prefijo"></span>
    <b id="barra-caso-nombre"></b>
    <small id="barra-caso-ay"></small>
  </span>
  <span class="barra-caso-acciones" id="barra-caso-acciones" hidden>
    <button type="button" id="barra-caso-cargar-plantilla" data-i18n="caso_cargar_plantilla"></button>
    <button type="button" id="barra-caso-guardar-plantilla" data-i18n="caso_guardar_plantilla"></button>
    <button type="button" id="barra-caso-volver" class="primario" data-i18n="barra_caso_volver"></button>
  </span>
</div>

<main>

  <!--
    El banco de trabajo es único -Técnicas, Catálogo, Cajas, Resumen-, siempre
    el mismo tanto si se edita una plantilla suelta como si se corrige el
    material de un caso. Qué montaje hay cargado se elige aparte, en la
    tarjeta Montajes de aquí abajo o desde la ficha de un caso; el rótulo
    permanente de arriba dice siempre cuál de los dos se está tocando.
  -->
  <div class="columna-principal">

    <!-- Fase 6: Montajes es ahora la pantalla principal, no un diálogo -abre
         sola al cargar la página, encima de Técnicas-. Mismo contenido que
         antes (buscador, acciones, lista), solo cambia el envoltorio: de
         <dialog> a <details> igual que el resto de tarjetas. -->
    <details class="card no-print" id="montajes" open>
      <summary class="card-cab">
        <h2 data-i18n="dlg_montajes_titulo"></h2>
      </summary>

      <div class="casos-filtros">
        <span>
          <label for="montajes-buscar" data-i18n="plantilla_filtro_buscar"></label>
          <input type="search" id="montajes-buscar" data-i18n-ph="plantilla_buscar_ph" autocomplete="off">
        </span>
      </div>

      <div class="montajes-acciones no-print">
        <button type="button" id="btn-duplicar" data-i18n="btn_duplicar"></button>
        <button type="button" id="btn-renombrar" data-i18n="btn_renombrar"></button>
        <button type="button" id="btn-vaciar" data-i18n="btn_vaciar"></button>
        <button type="button" id="btn-borrar" class="peligro" data-i18n="btn_borrar"></button>
        <button type="button" id="btn-guardar-montaje" class="primario" data-i18n="btn_guardar_montaje"></button>
      </div>

      <div id="dlg-montajes-lista"></div>
      <p class="cat-version" id="montajes-cuenta"></p>
    </details>

    <details class="card tecnicas-card no-print" id="tecnicas">
      <summary class="card-cab">
        <h2 data-i18n="tecnicas_titulo"></h2>
        <label class="perfil-label">
          <span data-i18n="perfil_label"></span>
          <select id="perfil-select"></select>
        </label>
      </summary>
      <div id="tecnicas-contenido"></div>
    </details>

    <!-- Conserva la clase panel-catalogo: es a lo que apunta el soltar
         material encima para quitarlo de una entrada. -->
    <div class="card panel-catalogo no-print" id="panel-catalogo">
      <div class="panel-cab">
        <h2 data-i18n="catalogo_titulo"></h2>
        <button type="button" id="btn-etiquetas" data-i18n-title="btn_etiquetas_tit" data-i18n="btn_etiquetas"></button>
        <button type="button" id="btn-nuevo-material" data-i18n-title="btn_nuevo_mat_tit">+</button>
        <button type="button" id="btn-plegar" data-i18n-title="btn_plegar_tit">▾</button>
      </div>
      <input type="search" id="catalogo-buscar" data-i18n-ph="catalogo_buscar" autocomplete="off">
      <p class="panel-ayuda" data-i18n-html="catalogo_ayuda"></p>
      <div id="catalogo-contenido"></div>
    </div>

    <details class="card" id="cajas">
      <summary class="card-cab">
        <h2 data-i18n="cajas_titulo"></h2>
        <span class="card-pista" id="cajas-pista"></span>
      </summary>
      <section id="cajas-contenido"></section>
    </details>

    <details class="card resumen-card" id="resumen">
      <summary class="card-cab">
        <h2 data-i18n="resumen_titulo"></h2>
      </summary>
      <div id="resumen-contenido"></div>
    </details>

  </div>

</main>

<div class="barra-seleccion no-print" id="barra-seleccion" hidden>
  <span><span data-i18n="colocando"></span> <b id="bs-nombre"></b> <span data-i18n="colocando_ayuda"></span></span>
  <button type="button" id="bs-cancelar" data-i18n="cancelar"></button>
</div>

<dialog id="dlg-sync" class="no-print">
  <h3 data-i18n="dlg_sync_titulo"></h3>
  <p class="dlg-intro" data-i18n-html="dlg_sync_intro"></p>

  <details class="dlg-ayuda">
    <summary data-i18n="dlg_sync_ayuda"></summary>
    <ol>
      <li data-i18n-html="sync_paso1"></li>
      <li data-i18n-html="sync_paso2"></li>
      <li data-i18n-html="sync_paso3"></li>
      <li data-i18n-html="sync_paso4"></li>
      <li data-i18n-html="sync_paso5"></li>
    </ol>
  </details>

  <div class="campo">
    <label for="sync-repo"><span data-i18n="campo_repo"></span> <span class="req">*</span></label>
    <input id="sync-repo" placeholder="usuario/checklist-mio-datos" autocomplete="off">
    <small data-i18n-html="campo_repo_ayuda"></small>
  </div>
  <div class="campo">
    <label for="sync-token"><span data-i18n="campo_token"></span> <span class="req">*</span></label>
    <input id="sync-token" type="password" placeholder="github_pat_…" autocomplete="off">
    <small data-i18n="campo_token_ayuda"></small>
  </div>

  <p class="dlg-error" id="sync-error" hidden></p>
  <p class="dlg-ok" id="sync-ok" hidden></p>

  <div class="dlg-botones">
    <button type="button" id="sync-olvidar" class="peligro" data-i18n="btn_desconectar"></button>
    <span class="barra-flex"></span>
    <button type="button" id="sync-cerrar" data-i18n="cerrar"></button>
    <button type="button" id="sync-bajar" data-i18n="btn_bajar"></button>
    <button type="button" id="sync-subir" class="primario" data-i18n="btn_subir"></button>
  </div>
</dialog>

<dialog id="dlg-material" class="no-print">
  <h3 id="dlg-titulo" data-i18n="dlg_mat_nuevo"></h3>
  <div class="campo">
    <label for="mat-nombre"><span data-i18n="campo_nombre"></span> <span class="req">*</span></label>
    <input id="mat-nombre" maxlength="40" data-i18n-ph="mat_ph_nombre">
  </div>
  <div class="campo">
    <label for="mat-categoria"><span data-i18n="campo_categoria"></span> <span class="req">*</span></label>
    <input id="mat-categoria" list="lista-categorias" data-i18n-ph="mat_ph_categoria">
    <datalist id="lista-categorias"></datalist>
  </div>
  <div class="campo">
    <label for="mat-etiqueta"><span data-i18n="campo_etiqueta"></span> <span class="req">*</span></label>
    <span class="campo-con-boton">
      <select id="mat-etiqueta"></select>
      <button type="button" id="mat-nueva-etiqueta" data-i18n-title="campo_gestionar_t" data-i18n="campo_gestionar"></button>
    </span>
    <small data-i18n="campo_etiqueta_ay"></small>
  </div>

  <fieldset class="campo-estilo">
    <legend data-i18n="grupo_aspecto"></legend>
    <div class="campo-fila">
      <span>
        <label for="mat-borde" data-i18n="campo_borde"></label>
        <select id="mat-borde" class="select-borde"></select>
      </span>
      <span>
        <label for="mat-color" data-i18n="campo_color_borde"></label>
        <select id="mat-color" class="select-color"></select>
      </span>
      <span>
        <label for="mat-fondo" data-i18n="campo_fondo"></label>
        <select id="mat-fondo" class="select-color"></select>
      </span>
    </div>
    <div class="vista-previa">
      <span class="vp-label" data-i18n="vista_previa"></span>
      <span class="chip" id="mat-previa"></span>
    </div>
  </fieldset>

  <div class="campo">
    <label class="check">
      <input type="checkbox" id="mat-sinentrada">
      <span data-i18n="campo_sin_entrada"></span>
    </label>
  </div>
  <div class="campo">
    <label for="mat-nota" data-i18n="campo_nota"></label>
    <textarea id="mat-nota" rows="2" data-i18n-ph="campo_nota_ph"></textarea>
  </div>
  <p class="dlg-error" id="mat-error" hidden></p>
  <div class="dlg-botones">
    <button type="button" id="mat-borrar" class="peligro" data-i18n="btn_borrar"></button>
    <span class="barra-flex"></span>
    <button type="button" id="mat-cancelar" data-i18n="cancelar"></button>
    <button type="button" id="mat-guardar" class="primario" data-i18n="guardar"></button>
  </div>
</dialog>

<dialog id="dlg-etiquetas" class="no-print">
  <h3 data-i18n="dlg_et_titulo"></h3>
  <p class="dlg-intro" data-i18n-html="dlg_et_intro"></p>

  <div id="etiquetas-lista" class="etiquetas-lista"></div>

  <hr class="dlg-sep">

  <h4 id="et-titulo" data-i18n="et_nueva"></h4>
  <div class="campo">
    <label for="et-nombre"><span data-i18n="campo_nombre"></span> <span class="req">*</span></label>
    <input id="et-nombre" maxlength="40" data-i18n-ph="et_ph_nombre">
    <small data-i18n="et_nombre_ayuda"></small>
  </div>
  <div class="campo-fila">
    <span>
      <label for="et-borde" data-i18n="campo_borde"></label>
      <select id="et-borde" class="select-borde"></select>
    </span>
    <span>
      <label for="et-color" data-i18n="campo_color_borde"></label>
      <select id="et-color" class="select-color"></select>
    </span>
    <span>
      <label for="et-fondo" data-i18n="campo_fondo"></label>
      <select id="et-fondo" class="select-color"></select>
    </span>
  </div>
  <div class="campo-fila">
    <span>
      <label for="et-precio" data-i18n="campo_precio"></label>
      <input id="et-precio" type="number" min="0" step="0.01" placeholder="—">
    </span>
    <span>
      <label class="check">
        <input type="checkbox" id="et-fungible" checked>
        <span data-i18n="campo_fungible"></span>
      </label>
    </span>
    <span>
      <label class="check">
        <input type="checkbox" id="et-manta">
        <span data-i18n="campo_manta"></span>
      </label>
    </span>
  </div>
  <p class="campo-ayuda" data-i18n="campo_precio_ay"></p>
  <p class="campo-ayuda" data-i18n="campo_manta_ay"></p>

  <div class="campo-fila">
    <span>
      <label for="et-color-libre" data-i18n="campo_color_medida"></label>
      <input id="et-color-libre" type="color" value="#8896a2">
    </span>
    <span class="vista-previa">
      <span class="vp-label" data-i18n="vista_previa"></span>
      <span class="chip" id="et-previa"></span>
    </span>
  </div>

  <p class="dlg-error" id="et-error" hidden></p>

  <div class="dlg-botones">
    <button type="button" id="et-borrar" class="peligro" hidden data-i18n="btn_borrar"></button>
    <span class="barra-flex"></span>
    <button type="button" id="et-cerrar" data-i18n="cerrar"></button>
    <button type="button" id="et-nueva" data-i18n="et_btn_nueva"></button>
    <button type="button" id="et-guardar" class="primario" data-i18n="guardar"></button>
  </div>
</dialog>

<dialog id="dlg-elegir" class="no-print">
  <h3 data-i18n="dlg_elegir_titulo"></h3>
  <p class="dlg-intro" id="elegir-destino"></p>
  <input id="elegir-buscar" type="search" data-i18n-ph="catalogo_buscar" autocomplete="off">
  <div id="elegir-contenido" class="elegir-contenido"></div>
  <div class="dlg-botones">
    <button type="button" id="elegir-quitar" class="peligro" hidden data-i18n="elegir_quitar"></button>
    <span class="barra-flex"></span>
    <button type="button" id="elegir-cerrar" data-i18n="cerrar"></button>
  </div>
</dialog>

<dialog id="dlg-guardar-montaje" class="no-print">
  <h3 data-i18n="dlg_guardar_montaje_titulo"></h3>
  <p class="dlg-intro" id="guardar-montaje-nombre"></p>
  <div class="dlg-botones">
    <button type="button" id="guardar-montaje-cancelar" data-i18n="cancelar"></button>
    <span class="barra-flex"></span>
    <button type="button" id="guardar-montaje-nuevo" data-i18n="guardar_montaje_nuevo"></button>
    <button type="button" id="guardar-montaje-sobrescribir" class="primario" data-i18n="guardar_montaje_sobrescribir"></button>
  </div>
</dialog>

<dialog id="dlg-casos" class="no-print">
  <h3 data-i18n="dlg_casos_titulo"></h3>

  <div class="casos-acciones">
    <button type="button" id="casos-guardar-montaje" class="primario" data-i18n="casos_guardar_montaje"></button>
    <small data-i18n="casos_guardar_ay"></small>
    <button type="button" id="casos-nuevo-cero" data-i18n="casos_nuevo_cero"></button>
    <small data-i18n="casos_nuevo_cero_ay"></small>
  </div>

  <div class="casos-filtros">
    <span>
      <label for="casos-estado" data-i18n="casos_filtro_estado"></label>
      <select id="casos-estado">
        <option value="" data-i18n="casos_filtro_todos"></option>
        <option value="preparado" data-i18n="caso_estado_preparado"></option>
        <option value="cerrado" data-i18n="caso_estado_cerrado"></option>
        <option value="cancelado" data-i18n="caso_estado_cancelado"></option>
      </select>
    </span>
    <span>
      <label for="casos-desde" data-i18n="casos_filtro_desde"></label>
      <input type="date" id="casos-desde">
    </span>
    <span>
      <label for="casos-hasta" data-i18n="casos_filtro_hasta"></label>
      <input type="date" id="casos-hasta">
    </span>
  </div>

  <div id="casos-lista" class="casos-lista"></div>
  <p class="cat-version" id="casos-cuenta"></p>

  <div class="dlg-botones">
    <button type="button" id="btn-exportar-casos" data-i18n-title="btn_exportar_casos_tit" data-i18n="btn_exportar_casos"></button>
    <span class="barra-flex"></span>
    <button type="button" id="casos-cerrar" data-i18n="cerrar"></button>
  </div>
</dialog>

<dialog id="dlg-caso" class="no-print">
  <div class="caso-cab">
    <h3 data-i18n="dlg_caso_titulo"></h3>
    <p class="caso-subtitulo" id="caso-subtitulo"></p>
  </div>

  <!-- Los 9 puntos de la ficha: 8 apartados plegables (uno por punto, todos
       cerrados por defecto -ver renderFichaCaso()-) más la barra de
       acciones fija de abajo, que queda fuera de este scroll a propósito
       para que Guardar/Cerrar siempre estén a mano sin bajar del todo. -->
  <div class="caso-scroll">
    <details class="caso-grupo" id="caso-g-traza">
      <summary data-i18n="caso_g_traza"></summary>
      <div class="caso-grupo-campos" id="caso-c-traza"></div>
    </details>
    <details class="caso-grupo" id="caso-g-paciente">
      <summary data-i18n="caso_g_paciente"></summary>
      <div class="caso-grupo-campos" id="caso-c-paciente"></div>
    </details>
    <details class="caso-grupo" id="caso-g-cirugia">
      <summary data-i18n="caso_g_cirugia"></summary>
      <div class="caso-grupo-campos" id="caso-c-cirugia"></div>
    </details>
    <details class="caso-grupo" id="caso-g-anestesia">
      <summary data-i18n="caso_g_anestesia"></summary>
      <div class="caso-grupo-campos" id="caso-c-anestesia"></div>
    </details>
    <details class="caso-grupo" id="caso-g-montaje">
      <summary data-i18n="caso_g_montaje"></summary>
      <div class="caso-grupo-campos" id="caso-c-montaje"></div>
    </details>
    <details class="caso-grupo" id="caso-g-desarrollo">
      <summary data-i18n="caso_g_desarrollo"></summary>
      <div class="caso-grupo-campos" id="caso-c-desarrollo"></div>
    </details>
    <details class="caso-grupo" id="caso-g-resultado">
      <summary data-i18n="caso_g_resultado"></summary>
      <div class="caso-grupo-campos" id="caso-c-resultado"></div>
    </details>
    <details class="caso-grupo" id="caso-g-formacion">
      <summary data-i18n="caso_g_formacion"></summary>
      <div class="caso-grupo-campos" id="caso-c-formacion"></div>
    </details>

    <p class="caso-meta" id="caso-meta"></p>
    <p class="dlg-error" id="caso-error" hidden></p>
  </div>

  <div class="dlg-botones caso-acciones">
    <button type="button" id="caso-borrar" class="peligro" hidden data-i18n="caso_borrar"></button>
    <button type="button" id="caso-crear-informe" data-i18n="caso_crear_informe"></button>
    <span class="barra-flex"></span>
    <button type="button" id="caso-volver" data-i18n="caso_volver"></button>
    <button type="button" id="caso-guardar" class="primario" data-i18n="guardar"></button>
  </div>
</dialog>

<dialog id="dlg-elegir-plantilla" class="no-print">
  <h3 data-i18n="dlg_elegir_plantilla_titulo"></h3>
  <div class="casos-filtros">
    <span>
      <label for="plantilla-buscar" data-i18n="plantilla_filtro_buscar"></label>
      <input type="search" id="plantilla-buscar" data-i18n-ph="plantilla_buscar_ph" autocomplete="off">
    </span>
  </div>
  <div id="plantilla-elegir-lista"></div>
  <p class="empty-hint" id="plantilla-elegir-vacio" hidden></p>
  <div class="dlg-botones">
    <span class="barra-flex"></span>
    <button type="button" id="plantilla-elegir-cerrar" data-i18n="cerrar"></button>
  </div>
</dialog>

<dialog id="dlg-aplicar-plantilla" class="no-print">
  <h3 data-i18n="dlg_aplicar_plantilla_titulo"></h3>
  <p class="dlg-intro" id="aplicar-plantilla-nombre"></p>
  <p class="dlg-intro" id="aplicar-plantilla-msg"></p>
  <p class="dlg-intro" id="aplicar-plantilla-msg2"></p>
  <div class="dlg-botones">
    <button type="button" id="aplicar-plantilla-cancelar" data-i18n="cancelar"></button>
    <span class="barra-flex"></span>
    <button type="button" id="aplicar-plantilla-anadir" data-i18n="plantilla_btn_anadir"></button>
    <button type="button" id="aplicar-plantilla-reemplazar" class="primario" data-i18n="plantilla_btn_reemplazar"></button>
  </div>
